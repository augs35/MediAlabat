{% extends "base.html" %}
{% block title %}Edit Clinic · MediAlabat{% endblock %}
{% block content %}
<h1 class="fade-in">✏️ {{ t('clinics.edit_title') }}</h1>

<form method="POST" class="stack-form card fade-in">
    <label>{{ t('clinics.name') }}
        <input type="text" name="name" value="{{ clinic.name }}" required>
    </label>
    <label>{{ t('clinics.address') }}
        <input type="text" name="address" value="{{ clinic.address or '' }}">
    </label>
    <button type="submit" class="btn-primary">{{ t('clinics.save') }}</button>
</form>
{% endblock %}
