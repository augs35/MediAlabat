{% extends "base.html" %}
{% block title %}Edit Profile · MediAlabat{% endblock %}
{% block content %}
<h1 class="fade-in">✏️ {{ t('profile.edit_title') }}</h1>

<form method="POST" class="stack-form card fade-in">
    <h2>🪪 {{ t('profile.personal') }}</h2>
    <div class="name-field-row name-field-row-3">
        <label>{{ t('auth.first_name') }}
            <input type="text" name="first_name" value="{{ user.first_name or '' }}" placeholder="{{ t('auth.first_name') }}">
        </label>
        <label>{{ t('auth.middle_name_optional') }}
            <input type="text" name="middle_name" value="{{ user.middle_name or '' }}" placeholder="{{ t('auth.middle_name_optional') }}">
        </label>
        <label>{{ t('auth.last_name') }}
            <input type="text" name="last_name" value="{{ user.last_name or '' }}" placeholder="{{ t('auth.last_name') }}">
        </label>
    </div>
    <label>{{ t('auth.email') }}
        <input type="email" name="email" value="{{ user.email or '' }}" required>
    </label>
    <label>{{ t('auth.contact_number') }}
        <input type="tel" name="contact_number" value="{{ user.contact_number or '' }}">
    </label>
    <label>{{ t('auth.dob') }}
        <input type="date" name="date_of_birth" value="{{ profile.date_of_birth or '' }}">
    </label>
    <label>{{ t('auth.address') }}
        <input type="text" name="address" value="{{ profile.address }}">
    </label>
    <label>{{ t('profile.emergency_contact_name') }}
        <input type="text" name="emergency_contact_name" value="{{ profile.emergency_contact_name or '' }}"
               placeholder="{{ profile.emergency_contact or '' }}">
    </label>
    <div class="name-field-row name-field-row-2">
        <label>{{ t('profile.emergency_contact_relation') }}
            <input type="text" name="emergency_contact_relation" value="{{ profile.emergency_contact_relation or '' }}">
        </label>
        <label>{{ t('profile.emergency_contact_number') }}
            <input type="tel" name="emergency_contact_number" value="{{ profile.emergency_contact_number or '' }}">
        </label>
    </div>

    <h2>🩺 {{ t('profile.health_info') }}</h2>
    <label>{{ t('profile.existing_conditions') }}
        <textarea name="existing_conditions">{{ profile.existing_conditions or '' }}</textarea>
    </label>
    <label>{{ t('profile.allergies') }}
        <textarea name="allergies">{{ profile.allergies or '' }}</textarea>
    </label>
    <label>{{ t('profile.medications') }}
        <textarea name="medications">{{ profile.medications or '' }}</textarea>
    </label>
    <label>{{ t('profile.medical_history') }}
        <textarea name="medical_history">{{ profile.medical_history or '' }}</textarea>
    </label>

    <button type="submit" class="btn-primary">{{ t('profile.save_changes') }}</button>
</form>
{% endblock %}
