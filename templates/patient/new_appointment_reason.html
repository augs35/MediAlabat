{% extends "base.html" %}
{% block title %}Reason for Visit · MediAlabat{% endblock %}
{% block content %}
<div class="wizard-steps">
    <span class="step done"><i>✓</i> {{ t('wizard.step_clinic') }}</span>
    <span class="step done"><i>✓</i> {{ t('wizard.step_datetime') }}</span>
    <span class="step active"><i>3</i> {{ t('wizard.step_reason') }}</span>
    <span class="step"><i>4</i> {{ t('wizard.step_confirm') }}</span>
</div>

<h1 class="fade-in">📝 {{ t('wizard.reason_title') }}</h1>
<form method="POST" class="stack-form">
    <label>{{ t('wizard.reason_label') }}
        <textarea name="reason" placeholder="{{ t('wizard.reason_placeholder') }}" required></textarea>
    </label>
    <button type="submit" class="btn-primary">{{ t('wizard.continue') }} →</button>
</form>
{% endblock %}
