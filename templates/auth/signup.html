{% extends "base.html" %}
{% block title %}Sign Up · MediAlabat{% endblock %}
{% block content %}
<div class="auth-card fade-in">
    <div class="auth-logo">🏥</div>
    <h1 class="brand-lg">MediAlabat</h1>
    <p class="auth-tagline">{{ t('auth.tagline') }}</p>
    <p class="subtitle">{{ t('auth.signup_title') }}</p>

    <form method="POST" class="stack-form">
        <label>{{ t('auth.full_name') }}
            <input type="text" name="full_name" required>
        </label>
        <label>{{ t('auth.email') }}
            <input type="email" name="email" required>
        </label>
        <label>{{ t('auth.password') }}
            <input type="password" name="password" required minlength="6">
        </label>
        <label>{{ t('auth.contact_number') }}
            <input type="tel" name="contact_number" required>
        </label>
        <label>{{ t('auth.dob') }}
            <input type="date" name="date_of_birth" required>
        </label>
        <label>{{ t('auth.sex') }}
            <select name="sex" required>
                <option value="">{{ t('auth.sex_select') }}</option>
                <option>{{ t('auth.sex_female') }}</option>
                <option>{{ t('auth.sex_male') }}</option>
                <option>{{ t('auth.sex_prefer_not') }}</option>
            </select>
        </label>
        <label>{{ t('auth.address') }}
            <input type="text" name="address" required>
        </label>
        <label>{{ t('auth.emergency_contact') }}
            <input type="text" name="emergency_contact" required>
        </label>
        <button type="submit" class="btn-primary btn-block">{{ t('auth.create_account') }}</button>
    </form>
    <p class="auth-switch">{{ t('auth.have_account') }} <a href="{{ url_for('login') }}">{{ t('auth.log_in') }}</a></p>
</div>
{% endblock %}
